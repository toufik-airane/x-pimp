name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Validate tag and manifest version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "zip=dist/x-zen-${version}.zip" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/x-zen-${version}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Verify the annotated tag signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_object=$(git rev-parse "${GITHUB_REF_NAME}^{tag}")
          verified=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq '.verification.verified')
          if [[ "${verified}" != "true" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not have a verified signature." >&2
            exit 1
          fi

      - name: Verify source
        run: node scripts/verify.mjs

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install --disable-pip-version-check semgrep==1.174.0

      - name: Scan source with Semgrep
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/semgrep/bin/semgrep" scan \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            .

      - name: Build and verify extension bundle
        shell: bash
        env:
          CHECKSUM_FILE: ${{ steps.release.outputs.checksum }}
          VERSION: ${{ steps.release.outputs.version }}
          ZIP_FILE: ${{ steps.release.outputs.zip }}
        run: |
          set -euo pipefail
          node scripts/package.mjs
          unzip -t "${ZIP_FILE}"
          (
            cd dist
            sha256sum "x-zen-${VERSION}.zip"
          ) > "${CHECKSUM_FILE}"

      - name: Publish GitHub release
        shell: bash
        env:
          CHECKSUM_FILE: ${{ steps.release.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          ZIP_FILE: ${{ steps.release.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${ZIP_FILE}" \
            "${CHECKSUM_FILE}" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}" \
            --title "x-zen ${{ steps.release.outputs.version }}" \
            --verify-tag

      - name: Write job summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Released x-zen ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
          echo "Tag: ${GITHUB_REF_NAME}" >> "${GITHUB_STEP_SUMMARY}"
